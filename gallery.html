    <!-- =========================================
         ARTWORK COLLECTION
         ========================================= -->

    <section
      class="gallery-collection"
      aria-label="Artwork collection">

      <div class="wrap">


        <!-- DYNAMIC COLLECTION FILTERS -->

        
<div
  class="filters"
  data-filters
  role="group"
  aria-label="Artwork collection filters"
>
  <button
    type="button"
    class="btn ghost"
    data-collection="selected"
    aria-pressed="true"
  >
    Selected Works
  </button>

  <button
    type="button"
    class="btn ghost"
    data-collection="all"
    aria-pressed="false"
  >
    All Artwork
  </button>
</div>



        <!-- DYNAMIC ARTWORK GRID -->

        <div
          class="art-grid"
          data-gallery
          aria-live="polite"
          aria-busy="true">

          <!-- LOADING PLACEHOLDERS -->

          <div class="art art-skeleton" aria-hidden="true">
            <span class="frame"></span>
            <span class="cap">
              <b></b>
              <i></i>
            </span>
          </div>

          <div class="art art-skeleton" aria-hidden="true">
            <span class="frame"></span>
            <span class="cap">
              <b></b>

            <span class="frame"></span>
            <span class="cap">
              <b></b>
              <i></i>
            </span>

          <div class="art art-skeleton" aria-hidden="true">
            <span class="frame"></span>
            <span class="cap">
              <b></b>
              <i></i>
            </span>
          </div>

        </div>
